name: Live calibration and commitment

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  live:
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Stop after the monitoring window
        run: |
          end=$(date -u -d '2026-11-17 23:59:59' +%s)
          now=$(date -u +%s)
          if [ "$now" -gt "$end" ]; then echo "Monitoring window ended"; exit 0; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@12.18.0 --activate && pnpm install --frozen-lockfile
      - name: Sample and write v2 live memory
        env:
          TATUM_API_KEY: ${{ secrets.TATUM_API_KEY }}
          MEMWAL_ACCOUNT_ID: ${{ secrets.MEMWAL_ACCOUNT_ID }}
          MEMWAL_KEY_CHECKER: ${{ secrets.MEMWAL_KEY_CHECKER }}
          MEMWAL_SERVER_URL: https://relayer.memory.walrus.xyz
        run: pnpm live:v2
      - name: Install the pinned Sui testnet CLI
        run: |
          curl --fail --location --retry 3 --output sui.tgz https://github.com/MystenLabs/sui/releases/download/testnet-v1.83.1/sui-testnet-v1.83.1-ubuntu-x86_64.tgz
          mkdir -p "$RUNNER_TEMP/sui"
          tar -xzf sui.tgz -C "$RUNNER_TEMP/sui"
          echo "SUI_BIN=$RUNNER_TEMP/sui/sui" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/sui/sui" --version
      - name: Configure the testnet signer
        env:
          SUI_PRIVATE_KEY: ${{ secrets.SUI_PRIVATE_KEY }}
        run: |
          "$SUI_BIN" client new-env --alias testnet --rpc https://fullnode.testnet.sui.io:443 || true
          "$SUI_BIN" keytool import "$SUI_PRIVATE_KEY" ed25519
          "$SUI_BIN" client switch --env testnet
      - name: Commit and verify through Tatum testnet gRPC
        env:
          SUI_BIN: ${{ env.SUI_BIN }}
          VO_TESTNET_PACKAGE_ID: ${{ secrets.VO_TESTNET_PACKAGE_ID }}
          TATUM_TESTNET_API_KEY: ${{ secrets.TATUM_TESTNET_API_KEY }}
          MEMWAL_ACCOUNT_ID: ${{ secrets.MEMWAL_ACCOUNT_ID }}
        run: |
          node scripts/commit-live-testnet.mjs
          node scripts/verify-testnet-commits.mjs
      - name: Commit evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/live-calls.json results/testnet-commitments.json results/testnet-verification.json
          git diff --cached --quiet || git commit -m "chore(live): record scheduled calibration evidence"
          git push origin HEAD:main
